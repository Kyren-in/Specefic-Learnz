# render.yaml — Render.com deployment configuration for Supabase PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: specific-learnz
    runtime: node
    region: singapore  # closest to India
    plan: free         # 100% free with Supabase host!

    # Build: install all deps and compile React
    buildCommand: npm run build:prod

    # Start: run Express which serves both API and built React
    startCommand: npm run start:prod

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random key
      # Add DATABASE_URL in Render Dashboard from Supabase:
      # - key: DATABASE_URL
      #   value: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
      # Optional API keys:
      # - key: GEMINI_API_KEY
      # - key: BREVO_API_KEY
      # - key: RAZORPAY_KEY_ID
      # - key: RAZORPAY_KEY_SECRET
